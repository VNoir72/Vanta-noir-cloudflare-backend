name: Android design update
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [preview, production]
        default: preview
        required: true
jobs:
  update_android:
    name: Verify and publish Android design
    type: update
    environment: production
    env:
      APP_VARIANT: customer
    params:
      platform: android
      channel: ${{ inputs.channel }}
      message: Organised You page, reliable account recovery and preorder dispatch details; build 32
    hooks:
      before_update:
        - name: Verify build 32 runtime compatibility
          run: node scripts/verify-build32-runtime.cjs
        - name: Check app types
          run: npm run typecheck
        - name: Check app lint
          run: npm run lint
        - name: Verify currency and order behaviour
          run: node --test tests/*.test.cjs
