plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'store.vantanoir'
version = '1.0.0'
android {
  namespace 'store.vantanoir.paystack'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  // Kotlin 2.1-compatible SDK; replaces legacy Compose UI dependencies in 0.0.9.
  implementation 'com.paystack.android:paystack-ui:0.1.3'
  implementation 'androidx.activity:activity-ktx:1.10.1'
}
