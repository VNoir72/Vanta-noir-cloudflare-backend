name: Isolated website and security verification
on:
  pull_request:
    branches: [vanta-update-30, codex/dual-shipping-rates]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Provision tools without repository lifecycle scripts
        run: docker build -f scripts/ci/Dockerfile -t vanta-check .
      - name: Run isolated verification and promote bounded evidence
        run: sudo python3 scripts/ci/run.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vanta-noir-verified-release
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: error
