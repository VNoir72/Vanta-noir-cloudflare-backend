<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin responsive layout check</title><style>body{margin:0;background:#dce1e3;font:14px system-ui}header{padding:10px;display:flex;gap:8px}button{padding:8px}iframe{display:block;border:0;background:white;max-width:none}</style></head><body><header><button data-w="1360" data-h="900">Desktop</button><button data-w="768" data-h="1024">Tablet portrait</button><button data-w="1024" data-h="768">Tablet landscape</button><button data-w="393" data-h="852">Phone portrait</button><button data-w="852" data-h="393">Phone landscape</button></header><iframe title="Admin preview" src="portal-audit.html?revenue=demo" width="1360" height="900"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=document.querySelector('iframe');f.width=b.dataset.w;f.height=b.dataset.h;f.contentWindow.dispatchEvent(new Event('orientationchange'));});</script></body></html>
